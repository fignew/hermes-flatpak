app-id: dev.nousresearch.hermes
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: hermes-desktop
# Bundle branch: flatter's bundle step reads `branch` verbatim from the
# manifest for `flatpak build-bundle`; the runtime BaseApp branch is
# separately `default-branch: 25.08`-shaped via base-version, so this only
# affects our app ref. 'master' matches the installed refs and the local
# build's bundle name convention (AGENTS.md).
branch: master
separate-locales: false
finish-args:
  # Agent needs outbound network (LLM APIs, updates, gateway)
  - --share=network
  # Opt cua-driver into its experimental native-Wayland backend sandbox-wide
  # (env override; reaches the gateway and every cua-driver it spawns —
  # wrapper exports alone don't propagate to already-running MCP daemons).
  # On niri/wlroots this enables portal-Screenshot capture and the libei
  # RemoteDesktop input probe; inert on X11-only sessions (no WAYLAND_DISPLAY).
  - --env=CUA_DRIVER_RS_ENABLE_WAYLAND=1
  # Display: prefer wayland (hint=auto in wrapper), x11 fallback
  - --socket=wayland
  - --socket=x11
  # Voice conversations (mic capture + playback)
  - --socket=pulseaudio
  # GPU acceleration
  - --device=dri
  # Chat exports / user file handoff via well-known dir; everything else
  # goes through portals. Deliberately NO --filesystem=home.
  - --filesystem=xdg-download
  # Notifications: Electron's Notification API talks to the session
  # notification daemon over D-Bus (org.freedesktop.Notifications).
  - --talk-name=org.freedesktop.Notifications
  # Accessibility bus (cua-driver ax/element targeting). Flatpak's bus proxy
  # special-cases org.a11y.Bus and wires AT_SPI_BUS_ADDRESS into the sandbox
  # when this grant is present. Only effective when the HOST session runs
  # at-spi2 (org.a11y.Bus on its session bus) — e.g. GNOME; on niri the host
  # session must start at-spi (at-spi-bus-launcher / GTK_MODULES=atk-bridge).
  - --talk-name=org.a11y.Bus
modules:
  # git 2.55.0 — the bundled agent uses git operationally (repo status,
  # version stamping). Built from the released tarball against the Sdk.
  - name: git
    buildsystem: simple
    build-commands:
      # NO_RUST: git >=2.55 has an optional Rust component; the Sdk has no
      # cargo and upstream defines NO_RUST exactly for this (Rust becomes
      # mandatory only in Git 3.0).
      - ./configure --prefix=/app --without-tcltk
      - make -j2 all NO_RUST=1
      - make install NO_RUST=1
      - rm -rf /app/share/gitweb /app/share/locale
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz
        sha256: 457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357

  # ripgrep 14.1.1 — the agent's file search prefers rg over grep; bundling
  # the static musl binary keeps that fast path inside the sandbox. x86_64
  # only: no official aarch64 musl release; module skipped on aarch64 (the
  # agent falls back to grep there).
  - name: ripgrep
    buildsystem: simple
    only-arches: [x86_64]
    build-commands:
      - |
        if [ "$(uname -m)" != "x86_64" ]; then
          echo "ripgrep: no aarch64 binary upstream; skipping (agent falls back to grep)"
          exit 0
        fi
        install -Dm755 ripgrep-14.1.1-x86_64-unknown-linux-musl/rg /app/bin/rg
        install -Dm644 ripgrep-14.1.1-x86_64-unknown-linux-musl/COPYING -t /app/share/licenses/ripgrep/
        install -Dm644 ripgrep-14.1.1-x86_64-unknown-linux-musl/UNLICENSE -t /app/share/licenses/ripgrep/
    sources:
      - type: archive
        url: https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
        sha256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
        # aarch64 builder still has to fetch+hash the x86_64 tarball; cheap no-op
        # upstream archive wraps everything in ripgrep-<ver>-musl/; keep it
        # or flatpak-builder strips the top dir and install paths miss by one
        strip-components: 0
        # aarch64 builder still fetches+hashes the x86_64 tarball; cheap no-op
        only-arches: [x86_64]

  # cua-driver 0.23.2 — Computer Use driver, bundled so the agent's
  # computer_use tool works with NO runtime install step. The upstream
  # installer targets ~/.local/bin, which is ephemeral in the sandbox home
  # and off the desktop's merged login-shell PATH; /app/bin is on PATH for
  # every process in the sandbox (bundled git/rg/hermes rely on the same
  # property). Layout mirrors the upstream installer: binary + cursor theme
  # colocated in one dir with the PATH symlink pointing at the binary (the
  # driver resolves cua-cursor-theme next to its own resolved path).
  # Hermes' runtime contract floor is 0.20.0 (cua_backend.py) — 0.23.2
  # satisfies it. Upstream stable channel: cua-driver-rs-v0.23.2 tag; the
  # tarball sha256 below was verified against that release's checksums.txt.
  # Re-pin by re-downloading into pinned/ + updating this hash.
  # The tarball also carries libcua_driver_sdk.so (39 MB) +
  # cua_driver_node_runtime.node + cua_driver_abi.h — SDK pieces for
  # embedders, NOT needed by the CLI (no NEEDED entries) — skipped here.
  - name: cua-driver
    buildsystem: simple
    # computer-use driver ships x86_64 binary only upstream
    only-arches: [x86_64]
    build-commands:
      - install -Dm755 cua-driver -t /app/lib/cua-driver/
      - install -Dm755 cua-cursor-theme -t /app/lib/cua-driver/
      - cp -R wayland-helper /app/lib/cua-driver/wayland-helper
      # /app/bin/cua-driver is a WRAPPER (not a symlink): it exports
      # CUA_DRIVER_RS_TELEMETRY_ENABLED=0 before exec'ing the real binary,
      # so bundled-driver invocations never send telemetry (env override is
      # first in the driver's consent precedence). The binary itself stays
      # in /app/lib/cua-driver/ so cua-cursor-theme keeps resolving next to
      # the resolved path, same as the upstream installer layout.
      - install -Dm755 cua-driver.sh /app/bin/cua-driver
    sources:
      - type: archive
        url: https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.23.2/cua-driver-rs-0.23.2-linux-x86_64-binary.tar.gz
        sha256: 01bf8339ec129cc00f4b4b2c6056ef1a7c5b52df39ff83ad17c9b16818aec500
        strip-components: 0
        only-arches: [x86_64]
      - type: file
        path: cua-driver.sh

  - name: hermes-desktop
    buildsystem: simple
    build-options:
      env:
        PATH: /app/bin:/usr/lib/sdk/node22/bin:/usr/bin:/bin:/usr/sbin:/sbin
        # node-gyp: use the Sdk extension's headers; downloading node's
        # headers tarball fails inside bwrap (tar fchown EINVAL as root).
        npm_config_nodedir: /usr/lib/sdk/node22
      build-args:
        - --share=network
    build-commands:
      # One block: only /app and this module dir persist between commands.
      # 1) Bundle the agent backend: repo at the pinned commit + venv
      #    pre-synced (uv sync --locked, hash-verified) so the desktop's
      #    resolver adopts it at runtime (bootstrap: false) and first-run
      #    needs no git/python toolchain/network install.
      # 2) Build the desktop payload in the sandbox so native modules
      #    (node-pty) link against the RUNTIME's glibc.
      - |
        set -e
        MODDIR=$(pwd)
        export HOME=$MODDIR/buildhome
        mkdir -p "$HOME"
        export UV_CACHE_DIR=$MODDIR/uvcache
        export UV_LINK_MODE=copy
        export UV_PYTHON=/usr/bin/python3
        # flatpak-builder strips the archive's top-level dir by default, so
        # the binaries may land at uv-dist/uv OR uv-dist/<triplet>/uv.
        UVBIN="$MODDIR/uv-dist/uv-$(uname -m)-unknown-linux-gnu"
        [ -x "$UVBIN/uv" ] || UVBIN="$MODDIR/uv-dist"
        export PATH="$UVBIN:$PATH"
        command -v uv >/dev/null || { echo "FATAL: uv not found in $MODDIR/uv-dist"; ls -la "$MODDIR/uv-dist"; exit 1; }
        git config --global --add safe.directory "$MODDIR/hermes-agent"
        git config --global --add safe.directory /app/lib/hermes-agent
        mkdir -p /app/lib /app/etc
        cp -a hermes-agent /app/lib/hermes-agent
        cd /app/lib/hermes-agent
        # upstream main's uv.lock drifts against pyproject (they regenerate
        # at release time); on a moving ref we must tolerate that. Locked
        # remains for pinned tag builds where the lockfile is coherent.
        if ! uv sync --locked --extra all; then
          echo "uv.lock out of sync with pyproject (expected on fast-moving main); re-locking"
          uv sync --extra all
        fi
        # Ship a system gitconfig so the bundled agent can operate on its
        # (root-owned, read-only) checkout without "dubious ownership".
        printf '[safe]\n\tdirectory = /app/lib/hermes-agent\n' > /app/etc/gitconfig
        # 2) desktop payload
        # npm ci resolves workspaces from the repo ROOT, not from a subdir.
        cd "$MODDIR/hermes-agent"
        npm ci --workspace apps/desktop --workspace apps/shared --no-audit --no-fund
        cd apps/desktop
        npm run build
        NODE_ARCH=$(uname -m | sed -e 's/x86_64/x64/' -e 's/aarch64/arm64/')
        NODE_OPTIONS=--max-old-space-size=4096 node scripts/run-electron-builder.mjs --linux dir --$NODE_ARCH
        mkdir -p /app/hermes
        cp -ra release/linux-unpacked/. /app/hermes/
        install -Dm755 "$MODDIR/hermes.sh" /app/bin/hermes-desktop
        install -Dm755 "$MODDIR/hermes-cli.sh" /app/bin/hermes
        install -Dm644 "$MODDIR/dev.nousresearch.hermes.desktop" -t /app/share/applications/
        # Version coherence: the flatpak's public version is the AGENT's
        # version (pyproject.toml), not the desktop npm package version.
        AGENT_VERSION=$(grep -m1 '^version = ' "$MODDIR/hermes-agent/pyproject.toml" | sed 's/version = "\(.*\)"/\1/')
        AGENT_DATE=$(git -C "$MODDIR/hermes-agent" log -1 --format=%cs)
        sed -i "s/@AGENT_VERSION@/$AGENT_VERSION/; s/@AGENT_DATE@/$AGENT_DATE/" "$MODDIR/dev.nousresearch.hermes.metainfo.xml"
        install -Dm644 "$MODDIR/dev.nousresearch.hermes.metainfo.xml" -t /app/share/metainfo/
        install -Dm644 "$MODDIR/dev.nousresearch.hermes.png" /app/share/icons/hicolor/512x512/apps/dev.nousresearch.hermes.png
        install -Dm644 "$MODDIR/dev.nousresearch.hermes.png" /app/share/icons/hicolor/256x256/apps/dev.nousresearch.hermes.png
        desktop-file-validate /app/share/applications/dev.nousresearch.hermes.desktop
    sources:
      # Upstream monorepo. The ref is substituted by packaging/generate-manifest.py:
      #  - daily (scheduled) workflow: `main` (latest commit each morning)
      #  - release workflow: the published tag (e.g. v2026.9.14)
      # A MOVING ref (branch) is the one case where a pinned checksum is
      # deliberately omitted: flatpak-builder resolves the ref to a commit
      # internally, and the workflow stamps that SHA into the release notes.
      # Swap to `commit: __HERMES_COMMIT__` if you ever need bit-for-bit
      # reproducibility instead of main-tracking.
      - type: git
        url: https://github.com/NousResearch/hermes-agent.git
        branch: __HERMES_REF__
        dest: hermes-agent
        # upstream history contains objects git (>=1.8.5) fsck flags with
        # `zeroPaddedFilemode`; flatpak-builder sets transfer.fsckObjects=1
        # on its mirror clones, so fetch dies mid-clone without this.
        # Disable fsck ONLY for this transient mirror dir — the actual
        # is then done locally from the mirror, no integrity gap beyond what
        # the flatpak-builder tree hash already covers.
        disable-fsckobjects: true
      # uv v0.12.9 — pinned per-arch; the script probes uv-dist for either
      # layout (triplet subdir or stripped top dir).
      - type: archive
        url: https://github.com/astral-sh/uv/releases/download/0.12.9/uv-x86_64-unknown-linux-gnu.tar.gz
        sha256: ec7a99cd05e0cd7f80243f135ce1361c76835cb0ee60055d14d20eba8eba1460
        dest: uv-dist
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/astral-sh/uv/releases/download/0.12.9/uv-aarch64-unknown-linux-gnu.tar.gz
        sha256: c36fe17937ff6bd16dc42fc13854b5465999fcab2efe0af559381e945e3c6001
        dest: uv-dist
        only-arches: [aarch64]
      - type: file
        path: hermes.sh
      - type: file
        path: hermes-cli.sh
      - type: file
        path: dev.nousresearch.hermes.desktop
      - type: file
        path: dev.nousresearch.hermes.metainfo.xml
      - type: file
        path: dev.nousresearch.hermes.png
