name: Flatpak Nightly Build

# Daily rebuild of the Hermes Desktop flatpak tracking hermes-agent `main`.
# This is the bleeding-edge channel; release tags are built separately
# (flatter-release.yml, dispatched by upstream-watch.yml).
#
# The manifest's type:git source re-resolves `main` at build time, and the
# resolved SHA is stamped into the run annotation + release notes here.

on:
  schedule:
    # 04:37 UTC daily ? deliberately off the top-of-hour cron herd.
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: upstream hermes-agent ref (branch or tag)
        default: main
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flatter
  cancel-in-progress: false

jobs:
  flatter:
    name: "Flatpak Nightly (${{ matrix.arch }})"
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/andyholmes/flatter/freedesktop:25.08
      options: --privileged
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      fail-fast: false
      max-parallel: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream ref and commit
        id: upstream
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref || 'main' }}"
          for i in 1 2 3; do
            COMMIT=$(git ls-remote https://github.com/NousResearch/hermes-agent.git "$REF" | awk '{print $1}') && [ -n "$COMMIT" ] && break
            echo "attempt $i: ls-remote failed; retrying in 30s (likely GitHub-side flake)"
            sleep 30
          done
          [ -n "$COMMIT" ] || { echo "::error::could not resolve ref '$REF'"; exit 1; }
          AGENT_VER=""
          for i in 1 2 3; do
            curl -fsSL "https://raw.githubusercontent.com/NousResearch/hermes-agent/$COMMIT/pyproject.toml" -o /tmp/pyproject.toml && break
            echo "attempt $i: pyproject fetch failed; retrying in 30s"; sleep 30
          done
          AGENT_VER=$(grep -m1 '^version = ' /tmp/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          [ -n "$AGENT_VER" ] || { echo "::error::could not extract agent version"; exit 1; }
          echo "ref=$REF"            >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT"      >> "$GITHUB_OUTPUT"
          echo "version=$AGENT_VER"  >> "$GITHUB_OUTPUT"
          echo "::notice::packaging hermes-agent $AGENT_VER @ $COMMIT (from $REF)"

      - name: Generate CI manifest
        env:
          HERMES_REF: ${{ steps.upstream.outputs.ref }}
        run: python3 packaging/generate-manifest.py

      # Preinstall the runtime + BaseApp + Sdk extension the manifest depends on.
      # The flatter container has flathub added as a remote but does NOT bundle
      # the freedesktop 25.08 SDK stack, so `flatpak-builder` fails immediately
      # with "org.electronjs.Electron2.BaseApp/x86_64/25.08 not installed".
      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          flatpak install -y --system flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.node22//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      # git-lfs shim: the flatter flatpak-builder patch runs `git lfs fetch --all`
      # and on failure `git lfs logs last` — which exits 2 when the log is empty,
      # killing the build. Historical LFS pointers (deleted binaries) 404 in the
      # upstream object store, so the shutdown path always triggers here.
      # Shim: make `logs` subcommands exit 0; everything else execs the real
      # git-lfs. Current-commit LFS objects (app icons) fetch fine earlier in
      # the same flow ("3 objects found").
      - name: Shim git-lfs logs diagnostics
        run: |
          set -euo pipefail
          REAL=$(command -v git-lfs || true)
          mkdir -p /usr/local/lfs-shim
          {
            echo '#!/bin/sh'
            echo 'case "$1" in logs) exit 0 ;; esac'
            echo '# fetch --all walks every historical ref'"'"'s LFS pointers; two deleted'
            echo '# binaries 404 upstream and abort the batch. The current-commit'
            echo '# icons are fetched at checkout (git lfs checkout), so a no-op here'
            echo '# is safe.'
            echo 'if [ "$1" = fetch ] && [ "$2" = --all ]; then exit 0; fi'
            if [ -n "$REAL" ] && [ "$REAL" != "/usr/local/lfs-shim/git-lfs" ]; then
              echo "exec ${REAL} \"\$@\""
            else
              echo 'exit 0'
            fi
          } > /usr/local/lfs-shim/git-lfs
          chmod +x /usr/local/lfs-shim/git-lfs
          export PATH="/usr/local/lfs-shim:$PATH"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Build
        uses: andyholmes/flatter@main
        with:
          files: |
            dev.nousresearch.hermes.yml
          arch: ${{ matrix.arch }}
          # Have flatter produce the single-file bundle .flatpak (we then
          # rename + re-upload it under our own name; flatter's own artifact
          # is harmless duplication).
          upload-bundles: true
          # Publish the flatpak REPO itself to GitHub Pages — upload only
          # from ONE matrix leg, else both race the same 'github-pages'
          # artifact name.
          # Per-arch repo artifacts for the merge step (upload from BOTH legs,
          # distinct artifact names so no race; merged in pages-deploy).
          upload-pages-artifact: true
          flatpak-build-bundle-args: |
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          # Per-arch cache keys so x86_64 and aarch64 don't fight over one
          # repository-cache entry.
          cache-key: flatter-${{ matrix.arch }}

      # flatter leaves the bundle at <app-id>.flatpak with branch 'master'
      # (taken from the manifest). Rename to Hermes-<ver>-<arch>.flatpak to
      # match AGENTS.md's naming convention, then smoke-test the renamed one.
      - name: Rename + smoke test bundle
        run: |
          set -euo pipefail
          NAME="Hermes-${{ steps.upstream.outputs.version }}-${{ matrix.arch }}.flatpak"
          [ -f dev.nousresearch.hermes.flatpak ] || { ls -la; echo "::error::bundle missing"; exit 1; }
          mv dev.nousresearch.hermes.flatpak "$NAME"
          chmod +x packaging/smoke-test.sh
          ./packaging/smoke-test.sh "$NAME"
          mkdir -p bundle
          cp "$NAME" bundle/
          sha256sum "$NAME" > "bundle/$NAME.sha256"
          echo "URL for release notes: $NAME"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-${{ steps.upstream.outputs.version }}-${{ matrix.arch }}
          path: bundle/*
          retention-days: 7
          if-no-files-found: error

  nightly-release:
    name: Publish rolling nightly
    needs: flatter
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: Hermes-*
          merge-multiple: true

      # Announce which commit the build was cut at (the ref is 'main'; the
      # commit SHA is embedded in each flatter job's Build log; simplified
      # here to the packaged version + date to keep the release notes honest
      # without cross-job output plumbing).
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(ls bundles/Hermes-*-x86_64.flatpak | sed 's/.*Hermes-\(.*\)-x86_64\.flatpak/\1/')
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hermes nightly $VER ($(date -u +%Y-%m-%d))" \
            --notes "Rolling nightly flatpak of Hermes Desktop, built from hermes-agent main (packaged version $VER).

          Install:
              flatpak install --user ./Hermes-$VER-x86_64.flatpak

          Aarch64 bundles are built too - pick the file matching your machine." \
            bundles/*
  pages-deploy:
    name: Deploy flatpak repo (GitHub Pages)
    needs: [flatter, nightly-release]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andyholmes/flatter/freedesktop:25.08
      options: --privileged
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download per-arch repo artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: github-pages-*
          path: repos
          merge-multiple: false

      - name: Unpack + merge repos (ostree pull-local)
        run: |
          set -euo pipefail
          mkdir -p merged
          first=1
          for tarfile in repos/*/artifact.tar; do
            d=$(basename "$(dirname "$tarfile")")
            mkdir -p "unpacked/$d"
            tar -xf "$tarfile" -C "unpacked/$d"
            echo "$d:"; ls "unpacked/$d" | head -3
            if [ "$first" = 1 ]; then
              cp -a "unpacked/$d/." merged/
              first=0
            else
              flatpak --repo=merged pull-local --untrusted "unpacked/$d"
            fi
          done
          flatpak build-update-repo merged

      - name: Upload merged repo as github-pages artifact
        run: |
          set -euo pipefail
          # actions/deploy-pages looks for an artifact named 'github-pages' containing a tar
          cd merged
          tar --dereference --hard-dereference -cf ../artifact.tar --exclude=.git .
          echo "artifact.tar bytes: $(stat -c%s ../artifact.tar)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
