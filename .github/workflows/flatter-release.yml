name: Flatpak Release Build

# Build a flatpak for a tagged Hermes release. Dispatched by upstream-watch.yml
# when a new tag appears on NousResearch/hermes-agent (or run manually with
# an existing tag name).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "upstream hermes-agent release tag (e.g. v2026.9.14)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: flatter-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  flatter:
    name: "Flatpak Release (${{ inputs.tag }}) (${{ matrix.arch }})"
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/andyholmes/flatter/freedesktop:25.08
      options: --privileged
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      fail-fast: false
      max-parallel: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag exists upstream and get its commit
        id: upstream
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          for i in 1 2 3; do
            # `refs/tags/<tag>` returns the TAG OBJECT sha for annotated tags
            # (raw.githubusercontent 404s on that sha) — ask for the peeled
            # commit with the `^{}` suffix instead.
            COMMIT=$(git ls-remote https://github.com/NousResearch/hermes-agent.git "refs/tags/$TAG^{}" | awk '{print $1}') && [ -n "$COMMIT" ] && break
            echo "attempt $i: ls-remote failed; retrying in 30s"
            sleep 30
          done
          [ -n "$COMMIT" ] || { echo "::error::tag '$TAG' not found on NousResearch/hermes-agent"; exit 1; }
          AGENT_VER=""
          for i in 1 2 3; do
            curl -fsSL "https://raw.githubusercontent.com/NousResearch/hermes-agent/$COMMIT/pyproject.toml" -o /tmp/pyproject.toml && break
            echo "attempt $i: pyproject fetch failed; retrying in 30s"; sleep 30
          done
          AGENT_VER=$(grep -m1 '^version = ' /tmp/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          [ -n "$AGENT_VER" ] || { echo "::error::could not extract agent version"; exit 1; }
          echo "ref=$TAG"            >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT"      >> "$GITHUB_OUTPUT"
          echo "version=$AGENT_VER"  >> "$GITHUB_OUTPUT"
          echo "::notice::packaging hermes-agent $AGENT_VER @ $COMMIT (tag $TAG)"

      - name: Generate CI manifest
        env:
          HERMES_REF: ${{ steps.upstream.outputs.ref }}
        run: python3 packaging/generate-manifest.py

      # Preinstall the runtime + BaseApp + Sdk extension the manifest depends on.
      # The flatter container has flathub added as a remote but does NOT bundle
      # the freedesktop 25.08 SDK stack — see flatter.yml's identical step.
      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          flatpak install -y --system flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.node22//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      # git-lfs shim: the flatter flatpak-builder patch runs `git lfs fetch --all`
      # and on failure `git lfs logs last` — which exits 2 when the log is empty,
      # killing the build. Historical LFS pointers (deleted binaries) 404 in the
      # upstream object store, so the shutdown path always triggers here.
      # Shim: make `logs` subcommands exit 0; everything else execs the real
      # git-lfs. Current-commit LFS objects (app icons) fetch fine earlier in
      # the same flow ("3 objects found").
      - name: Shim git-lfs logs diagnostics
        run: |
          set -euo pipefail
          REAL=$(command -v git-lfs || true)
          mkdir -p /usr/local/lfs-shim
          {
            echo '#!/bin/sh'
            echo 'case "$1" in logs) exit 0 ;; esac'
            echo '# fetch --all walks every historical ref'"'"'s LFS pointers; two deleted'
            echo '# binaries 404 upstream and abort the batch. The current-commit'
            echo '# icons are fetched at checkout (git lfs checkout), so a no-op here'
            echo '# is safe.'
            echo 'if [ "$1" = fetch ] && [ "$2" = --all ]; then exit 0; fi'
            if [ -n "$REAL" ] && [ "$REAL" != "/usr/local/lfs-shim/git-lfs" ]; then
              echo "exec ${REAL} \"\$@\""
            else
              echo 'exit 0'
            fi
          } > /usr/local/lfs-shim/git-lfs
          chmod +x /usr/local/lfs-shim/git-lfs
          export PATH="/usr/local/lfs-shim:$PATH"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Build
        uses: andyholmes/flatter@main
        with:
          files: |
            dev.nousresearch.hermes.yml
          arch: ${{ matrix.arch }}
          upload-bundles: true
          flatpak-build-bundle-args: |
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          cache-key: flatter-${{ matrix.arch }}

      - name: Rename + smoke test bundle
        id: bundle
        run: |
          set -euo pipefail
          NAME="Hermes-${{ steps.upstream.outputs.version }}-${{ matrix.arch }}.flatpak"
          [ -f dev.nousresearch.hermes.flatpak ] || { ls -la; echo "::error::bundle missing"; exit 1; }
          mv dev.nousresearch.hermes.flatpak "$NAME"
          chmod +x packaging/smoke-test.sh
          ./packaging/smoke-test.sh "$NAME"
          mkdir -p bundle
          cp "$NAME" bundle/
          sha256sum "$NAME" > "bundle/$NAME.sha256"
          echo "version=${{ steps.upstream.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-${{ steps.upstream.outputs.version }}-${{ matrix.arch }}
          path: bundle/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish release
    needs: flatter
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.ver }}
    steps:
      - name: Determine packaged version
        id: version
        run: |
          VER=$(ls bundles/Hermes-*-x86_64.flatpak | sed 's/.*Hermes-\(.*\)-x86_64\.flatpak/\1/')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: Hermes-*
          merge-multiple: true

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          # DERIVE $VER from the bundle filenames in this job (avoids matrix
          # job-output propagation, which GitHub only propagates from the
          # last matrix leg). Version derived at build time from
          # pyproject.toml may differ slightly from the upstream tag ?
          # publish as the manifest-derived version, keeping the upstream
          # tag as the fetch handle.
          VER=$(ls bundles/Hermes-*-x86_64.flatpak | sed 's/.*Hermes-\(.*\)-x86_64\.flatpak/\1/')
          # A release tag on the flatpak repo
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hermes $VER (flatpak)" \
            --notes "Flatpak for hermes-agent release [$TAG](https://github.com/NousResearch/hermes-agent/releases/tag/$TAG) (packaged version $VER).

          Install:
              flatpak install --user ./Hermes-$VER-x86_64.flatpak" \
            bundles/*
