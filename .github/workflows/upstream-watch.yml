name: upstream-watch

# Optional helper: cancel the schedule and dispatch an immediate
# flatter-release build as soon as a new upstream release tag appears, rather
# than waiting for the next daily window.
#
# Runs hourly (within GitHub's free allotment for public repos; a single
# ls-remote call each run is negligible).

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Detect latest upstream release tag
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Latest published release tag on the upstream repo.
          TAG=$(gh api '/repos/NousResearch/hermes-agent/releases/latest' \
            --jq '.tag_name' 2>/dev/null) || {
              echo "::warning::upstream has no releases yet; nothing to do"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
          }
          # Only fire if we haven't already built this tag in this repo.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no new tag (latest upstream $TAG already built)"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "new upstream tag: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch flatter-release
        if: steps.detect.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          gh workflow run flatter-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$TAG"
          echo "dispatched flatter-release for $TAG"
